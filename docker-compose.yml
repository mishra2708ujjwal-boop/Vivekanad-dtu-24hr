version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: seva_postgres
    environment:
      POSTGRES_USER: seva
      POSTGRES_PASSWORD: seva
      POSTGRES_DB: seva
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: seva_redis
    ports:
      - '6379:6379'

volumes:
  postgres_data:
